services:
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: change-me-to-a-long-random-development-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql://shopzone:shopzone@db:5432/shopzone_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopzone_db
      POSTGRES_USER: shopzone
      POSTGRES_PASSWORD: shopzone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopzone -d shopzone_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
